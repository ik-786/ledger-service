name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest

  model-and-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: 300 random operation sequences against the reference model
        run: LEDGER_MODEL_SEEDS=300 pytest tests/test_model.py
      - name: Load test, then audit the database
        run: python scripts/loadtest.py --clients 16 --seconds 10

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ledger-service .
      - run: docker run -d --name ledger -p 8000:8000 ledger-service
      - run: bash scripts/smoke.sh http://127.0.0.1:8000
      - run: docker exec ledger python -m ledger check
      - if: failure()
        run: docker logs ledger
