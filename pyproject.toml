[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-service"
version = "0.1.0"
description = "A double-entry ledger HTTP service: accounts, transfers, holds, reversals and idempotent writes on SQLite."
readme = "README.md"
license = "MIT"
authors = [{ name = "Imran Khan" }]
requires-python = ">=3.11"
dependencies = [
    "starlette>=1.0,<2",
    "pydantic>=2.6,<3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
ledger = "ledger.__main__:main"

[tool.setuptools]
packages = ["ledger"]

[tool.setuptools.package-data]
ledger = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ledger"]
